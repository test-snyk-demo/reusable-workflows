name: JavaScript Snyk Scan

# Reusable Snyk scan for an npm project at the repo root: Open Source (dependencies) and Code (SAST).
# - Findings go to GitHub code scanning (SARIF) and one PR comment with links to this run in Snyk.
# - fail-on-issues turns on the quality gate (the callers set it on pull requests).
# - Publishes to Snyk (`snyk monitor`, `snyk code test --report`) on PRs, feat* branches and, with
#   monitor, the default branch, each under its branch name.
# - Needs the SNYK_TOKEN secret.
#
# Caller job permissions: contents: read, actions: read, security-events: write,
# pull-requests: write. To publish Snyk Code results, the token's role also needs "View Project Ignores".

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: lts/*
      fail-on-issues:
        type: boolean
        default: false
      severity-threshold:
        type: string
        default: high
      monitor:
        type: boolean
        default: false
      project-name:
        type: string
      snyk-org:
        type: string
    secrets:
      snyk-token:
        required: false

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  snyk:
    name: Snyk Scan
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.snyk-token }}
      SNYK_ORG: ${{ inputs.snyk-org || github.repository_owner }}
      SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
      PROJECT_NAME: ${{ inputs.project-name || github.repository }}
      REMOTE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_REFERENCE: ${{ github.head_ref || github.ref_name }}
      PUBLISH: ${{ inputs.monitor || github.event_name == 'pull_request' || startsWith(github.head_ref || github.ref_name, 'feat') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            snyk = "1.1308.4"

      - run: npm ci

      - name: Snyk Open Source test
        id: snyk-oss
        continue-on-error: true
        run: |
          rc=0
          snyk test --org="$SNYK_ORG" --severity-threshold="$SEVERITY_THRESHOLD" --sarif-file-output=snyk-oss.sarif || rc=$?
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Publish dependency snapshot to Snyk
        id: snyk-monitor
        if: env.PUBLISH == 'true'
        continue-on-error: true
        run: |
          rc=0
          snyk monitor --org="$SNYK_ORG" --remote-repo-url="$REMOTE_REPO_URL" --target-reference="$TARGET_REFERENCE" > snyk-monitor.out 2>&1 || rc=$?
          cat snyk-monitor.out
          echo "url=$(grep -o 'https://app.snyk.io/org/[^ ]*' snyk-monitor.out | head -1)" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Snyk Code test
        id: snyk-code
        continue-on-error: true
        run: |
          args=(--org="$SNYK_ORG")
          [[ "$PUBLISH" == "true" ]] && args+=(--report --remote-repo-url="$REMOTE_REPO_URL" --target-reference="$TARGET_REFERENCE" --project-name="$PROJECT_NAME")
          threshold="$SEVERITY_THRESHOLD"; [[ "$threshold" == "critical" ]] && threshold=high
          rc=0
          snyk code test "${args[@]}" --severity-threshold="$threshold" --sarif-file-output=snyk-code.sarif > snyk-code.out 2>&1 || rc=$?
          cat snyk-code.out
          echo "url=$(grep -o 'https://app.snyk.io/org/[^ ]*' snyk-code.out | head -1)" >> "$GITHUB_OUTPUT"
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Same code scanning category on every branch
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        run: |
          jq '(.runs[]? | select(.automationDetails != null) | .automationDetails.id) = "Snyk/Code/"' snyk-code.sarif > fixed.sarif
          mv fixed.sarif snyk-code.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('snyk-oss.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Comment summary on PR
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          MARKER: "<!-- snyk-js-scan-summary -->"
          THRESHOLD: ${{ inputs.severity-threshold }}
          SCANS: >-
            [{"label": "Open Source", "url": "${{ steps.snyk-monitor.outputs.url }}", "file": "snyk-oss.sarif", "outcome": "${{ steps.snyk-oss.outcome }}"},
             {"label": "Code (SAST)", "url": "${{ steps.snyk-code.outputs.url }}", "file": "snyk-code.sarif", "outcome": "${{ steps.snyk-code.outcome }}"}]
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request?.number;
            if (!pr) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
              pr = data.find((p) => p.state === 'open')?.number;
            }
            if (!pr) return;
            const RANK = { low: 1, medium: 2, high: 3, critical: 4 };
            const threshold = process.env.THRESHOLD.toLowerCase();
            const floor = RANK[threshold] ?? 3;
            const sev = (s) => (s >= 9 ? 4 : s >= 7 ? 3 : s >= 4 ? 2 : s > 0 ? 1 : 0);
            const count = (file, outcome) => {
              if (outcome === 'success') return 0;
              if (!fs.existsSync(file)) return null;
              let n = 0;
              for (const run of JSON.parse(fs.readFileSync(file, 'utf8')).runs || []) {
                const rules = new Map((run.tool?.driver?.rules || []).map((r) => [r.id, r]));
                for (const r of run.results || []) {
                  const s = sev(parseFloat(rules.get(r.ruleId)?.properties?.['security-severity']));
                  if (!s || s >= floor) n++;
                }
              }
              return n;
            };
            const scans = JSON.parse(process.env.SCANS).map((s) => ({ ...s, n: count(s.file, s.outcome) }));
            const query = encodeURIComponent(context.payload.pull_request ? `is:open pr:${pr}` : `is:open branch:${context.ref.replace('refs/heads/', '')}`);
            const security = `${context.serverUrl}/${owner}/${repo}/security/code-scanning?query=${query}`;
            const run = scans.find((s) => s.url)?.url;
            const body = [
              process.env.MARKER, '## Snyk scan', '',
              `Showing \`${threshold}\` and above. ${[run ? `[View this run in Snyk](${run})` : '', `[GitHub Security tab](${security})`].filter(Boolean).join(' · ')}`, '',
              '| Scan | Findings | Details |', '| --- | ---: | --- |',
              ...scans.map((s) => `| ${s.label} | ${s.n === null ? ':warning: did not complete' : s.n} | ${s.url ? `[See full details in Snyk →](${s.url})` : '—'} |`),
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr, per_page: 100 });
            const mine = comments.find((c) => c.body?.includes(process.env.MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });

      - name: Quality gate
        if: inputs.fail-on-issues && (steps.snyk-oss.outcome == 'failure' || steps.snyk-code.outcome == 'failure')
        run: |
          echo "::error title=Snyk quality gate::Snyk found issues at or above '$SEVERITY_THRESHOLD' (Open Source exit ${{ steps.snyk-oss.outputs.exit-code }}, Code exit ${{ steps.snyk-code.outputs.exit-code }})."
          exit 1

      - name: Fail if publishing to Snyk failed
        if: ${{ !cancelled() && steps.snyk-monitor.outcome == 'failure' }}
        run: |
          echo "::error title=Snyk publish::snyk monitor couldn't publish the dependency snapshot."
          exit 1
