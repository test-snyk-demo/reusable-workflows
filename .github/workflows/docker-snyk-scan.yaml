name: Snyk Container Scan

# Scans the image tar saved by docker-build.yaml. Findings go to the Security tab (SARIF) and the
# run's summary page; monitor publishes a snapshot to Snyk and links it from the summary;
# fail-on-issues turns on the quality gate (the job fails, so jobs that need it don't run).
# Runs on the default branch (main) only; anywhere else the job is skipped.
#
# Caller job permissions: contents: read, actions: read, security-events: write.

on:
  workflow_call:
    inputs:
      image-artifact:
        type: string
        required: true
        description: Artifact holding <image-artifact>.tar.
      dockerfile:
        type: string
        description: Dockerfile the image came from; adds base-image upgrade advice.
      fail-on-issues:
        type: boolean
        default: false
      severity-threshold:
        type: string
        default: high
      exclude-app-vulns:
        type: boolean
        default: false
        description: Scan the OS layer only (app dependencies are covered by Snyk Open Source).
      monitor:
        type: boolean
        default: false
      project-name:
        type: string
      snyk-org:
        type: string
    secrets:
      snyk-token:
        required: false

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  snyk-container:
    name: Snyk Container Scan
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.snyk-token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/image

      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            snyk = "1.1308.4"

      - name: Snyk Container test
        id: test
        continue-on-error: true
        env:
          ARGS: >-
            docker-archive:${{ runner.temp }}/image/${{ inputs.image-artifact }}.tar
            --project-name=${{ inputs.project-name || github.repository }}
            --org=${{ inputs.snyk-org || github.repository_owner }}
            ${{ inputs.dockerfile && format('--file={0}', inputs.dockerfile) || '' }}
            ${{ inputs.exclude-app-vulns && '--exclude-app-vulns' || '' }}
        run: snyk container test $ARGS --severity-threshold=${{ inputs.severity-threshold }} --sarif-file-output=snyk-container.sarif --json-file-output=snyk-container.json

      - name: Snyk Container monitor
        id: monitor
        if: inputs.monitor
        continue-on-error: true
        env:
          ARGS: >-
            docker-archive:${{ runner.temp }}/image/${{ inputs.image-artifact }}.tar
            --project-name=${{ inputs.project-name || github.repository }}
            --org=${{ inputs.snyk-org || github.repository_owner }}
            ${{ inputs.dockerfile && format('--file={0}', inputs.dockerfile) || '' }}
            ${{ inputs.exclude-app-vulns && '--exclude-app-vulns' || '' }}
        run: |
          rc=0
          snyk container monitor $ARGS --target-reference=${{ github.ref_name }} > monitor.out 2>&1 || rc=$?
          cat monitor.out
          echo "url=$(grep -o 'https://app.snyk.io/org/[^ ]*' monitor.out | head -1)" >> "$GITHUB_OUTPUT"
          exit $rc

      # GitHub rejects Snyk's SARIF when a fix text isn't a string; coerce it.
      - name: Fix SARIF for GitHub
        if: ${{ !cancelled() && hashFiles('snyk-container.sarif') != '' }}
        run: |
          jq '(.runs[]?.results[]?.fixes[]?.artifactChanges[]?.replacements[]?.insertedContent.text) |= (if type == "string" then . elif . == null then "" else tostring end)' \
            snyk-container.sarif > fixed.sarif && mv fixed.sarif snyk-container.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('snyk-container.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.test.outcome }}
          THRESHOLD: ${{ inputs.severity-threshold }}
          SNYK_URL: ${{ steps.monitor.outputs.url }}
          SECURITY_TAB: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+tool%3A%22Snyk+Container%22+branch%3A${{ github.ref_name }}
        run: |
          {
            if [[ "$OUTCOME" == "success" ]]; then echo "## ✅ Snyk Container scan passed"
            else echo "## ❌ Snyk Container scan found issues at or above \`$THRESHOLD\`"; fi
            echo
            if [[ -f snyk-container.json ]]; then
              jq -r '(if type == "array" then . else [.] end) as $p
                | "Image: `\($p[0].path // "image")` · base image: `\($p[0].docker.baseImage // "unknown")`", "",
                  "| Layer | Critical | High | Medium | Low |", "| --- | ---: | ---: | ---: | ---: |",
                  ($p[] | ([.vulnerabilities[]? | {id, severity}] | unique) as $v
                    | "| \(.targetFile // .displayTargetFile // "OS packages") | \([$v[] | select(.severity == "critical")] | length) | \([$v[] | select(.severity == "high")] | length) | \([$v[] | select(.severity == "medium")] | length) | \([$v[] | select(.severity == "low")] | length) |")' snyk-container.json
            else
              echo "The scan didn't produce results."
            fi
            echo
            links="[GitHub Security tab]($SECURITY_TAB)"
            [[ -n "$SNYK_URL" ]] && links="[View this run in Snyk]($SNYK_URL) · $links"
            echo "$links"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quality gate
        if: inputs.fail-on-issues && steps.test.outcome == 'failure'
        run: |
          echo "::error title=Snyk quality gate::Snyk Container found issues at or above '${{ inputs.severity-threshold }}', or the scan didn't complete."
          exit 1
