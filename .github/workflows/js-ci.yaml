name: JavaScript CI

# Reusable CI pipeline for JavaScript projects (npm or pnpm):
#   build (a package.json script) + Snyk Open Source + Code -> Docker build -> Snyk Container -> push
#
# - build: false skips the build job (for apps with no build script).
# - Snyk is report-only unless snyk-fail-on-issues is true, and needs a snyk-token (the SNYK_TOKEN
#   secret). Results are published to Snyk (monitor) only on the default branch and
#   hotfix/* branches, or always with snyk-force-monitor.
# - The Docker steps run when docker-build is true, on the default branch only. The image is pushed
#   to GHCR only after the Snyk Container scan passes; dry-run never pushes.
# - container-fail-on-issues makes high/critical image issues fail the scan, so the image isn't pushed.
#
# Caller job permissions: contents: read, actions: read, security-events: write,
# pull-requests: write, packages: write.

on:
  workflow_call:
    inputs:
      runner-labels-json:
        type: string
        default: '["ubuntu-24.04"]'
      node-version:
        type: string
        default: lts/*
      pnpm:
        type: boolean
        default: false
      pnpm-version:
        type: string
        default: "10"
      working-directory:
        type: string
        default: .
      strict-lockfile:
        type: boolean
        default: true
      build:
        type: boolean
        default: true
        description: Run the build job.
      build-script:
        type: string
        default: build
        description: package.json script the build job runs.
      build-artifact-name:
        type: string
      build-artifact-path:
        type: string
      docker-build:
        type: boolean
        default: false
        description: Build the Docker image and scan it with Snyk Container.
      docker-image-name:
        type: string
      docker-context:
        type: string
        default: .
      docker-file:
        type: string
      docker-force-push:
        type: boolean
        default: false
      default-branch:
        type: string
        description: Treat this branch as the default branch (push + monitor). Empty = the repo's default.
      dry-run:
        type: boolean
        default: false
        description: Never push the image.
      snyk-fail-on-issues:
        type: boolean
        default: false
      snyk-severity-threshold:
        type: string
        default: high
      snyk-project-name:
        type: string
      snyk-org:
        type: string
        description: Snyk org slug. Defaults to the caller repo's GitHub owner.
      snyk-force-monitor:
        type: boolean
        default: false
      container-fail-on-issues:
        type: boolean
        default: false
        description: Fail the container scan (and don't push) on issues at or above snyk-severity-threshold.
      container-exclude-app-vulns:
        type: boolean
        default: false
        description: Container scan checks the OS layer only; app dependencies are left to Snyk Open Source.
    secrets:
      snyk-token:
        required: false
        description: Snyk token (the SNYK_TOKEN secret).
    outputs:
      build-artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      image-ref:
        value: ${{ jobs.docker-push.outputs.image-ref }}
      image-tag:
        value: ${{ jobs.docker-build.outputs.build-tag }}
      image-digest:
        value: ${{ jobs.docker-push.outputs.image-digest }}

concurrency:
  group: js-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  packages: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    env:
      DEFAULT_BRANCH: ${{ inputs.default-branch || github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
      REF: ${{ github.ref }}
      EVENT: ${{ github.event_name }}
    outputs:
      release-branch: ${{ steps.branch.outputs.release }}
    steps:
      - name: Is this the default or a hotfix branch?
        id: branch
        run: |
          release=false
          if [[ "$EVENT" != "pull_request" && ( "$BRANCH" == "$DEFAULT_BRANCH" || "$REF" == refs/heads/hotfix/* ) ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    if: inputs.build && github.event_name != 'pull_request'  # PRs run the Snyk scan only
    uses: ./.github/workflows/js-build.yaml
    with:
      runner-labels-json: ${{ inputs.runner-labels-json }}
      node-version: ${{ inputs.node-version }}
      pnpm: ${{ inputs.pnpm }}
      pnpm-version: ${{ inputs.pnpm-version }}
      working-directory: ${{ inputs.working-directory }}
      script-name: ${{ inputs.build-script }}
      strict-lockfile: ${{ inputs.strict-lockfile }}
      artifact-name: ${{ inputs.build-artifact-name }}
      artifact-path: ${{ inputs.build-artifact-path }}

  snyk:
    name: Snyk
    needs: [setup]
    uses: ./.github/workflows/js-snyk.yaml
    with:
      node-version: ${{ inputs.node-version }}
      fail-on-issues: ${{ inputs.snyk-fail-on-issues }}
      severity-threshold: ${{ inputs.snyk-severity-threshold }}
      project-name: ${{ inputs.snyk-project-name }}
      snyk-org: ${{ inputs.snyk-org }}
      monitor: ${{ inputs.snyk-force-monitor || needs.setup.outputs.release-branch == 'true' }}
    secrets:
      snyk-token: ${{ secrets.snyk-token }}

  docker-build:
    name: Docker
    needs: [setup, build, snyk]
    # Not on pull requests: the image is built and scanned on pushes (main, hotfix/**) and manual runs only.
    if: ${{ !cancelled() && inputs.docker-build && github.event_name != 'pull_request' && needs.snyk.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/docker-build.yaml
    with:
      image-name: ${{ inputs.docker-image-name }}
      context: ${{ inputs.docker-context }}
      dockerfile: ${{ inputs.docker-file }}
      push: false
      export-image: true

  container-scan:
    name: Snyk Container
    needs: [setup, docker-build]
    if: ${{ !cancelled() && inputs.docker-build && github.event_name != 'pull_request' && needs.docker-build.outputs.image-artifact != '' }}
    uses: ./.github/workflows/docker-snyk-scan.yaml
    with:
      image-artifact: ${{ needs.docker-build.outputs.image-artifact }}
      dockerfile: ${{ inputs.docker-file || format('{0}/Dockerfile', inputs.docker-context) }}
      fail-on-issues: ${{ inputs.container-fail-on-issues || inputs.snyk-fail-on-issues }}
      exclude-app-vulns: ${{ inputs.container-exclude-app-vulns }}
      severity-threshold: ${{ inputs.snyk-severity-threshold }}
      project-name: ${{ inputs.snyk-project-name && format('{0}-container', inputs.snyk-project-name) || format('{0}-container', github.repository) }}
      snyk-org: ${{ inputs.snyk-org }}
      monitor: ${{ inputs.snyk-force-monitor || needs.setup.outputs.release-branch == 'true' }}
    secrets:
      snyk-token: ${{ secrets.snyk-token }}

  docker-push:
    name: Push image
    needs: [setup, docker-build, container-scan]
    if: ${{ !cancelled() && needs.container-scan.result == 'success' && !inputs.dry-run && (inputs.docker-force-push || needs.setup.outputs.release-branch == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ needs.docker-build.outputs.image-ref }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.docker-build.outputs.image-artifact }}
          path: ${{ runner.temp }}/image

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the scanned image
        id: push
        env:
          IMAGE_REF: ${{ needs.docker-build.outputs.image-ref }}
          TAR: ${{ runner.temp }}/image/${{ needs.docker-build.outputs.image-artifact }}.tar
        run: |
          docker load -i "$TAR"
          docker push "$IMAGE_REF"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE_REF\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"
