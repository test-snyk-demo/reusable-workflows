name: Docker Build

# Builds the image, pushes it to GHCR (ghcr.io/<owner>/<image-name>) when asked, and saves it as a
# tar artifact for docker-snyk-scan.yaml. Every image is tagged with the short commit SHA.
# Runs on the default branch (main) only; anywhere else the job is skipped.
#
# Caller job permissions: contents: read, and packages: write to push.

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        description: Image name. Defaults to the repo name.
      context:
        type: string
        default: .
      dockerfile:
        type: string
        description: Path to the Dockerfile. Defaults to <context>/Dockerfile.
      push:
        type: boolean
        default: false
      export-image:
        type: boolean
        default: true
        description: Save the image as a tar artifact for the container scan.
    outputs:
      image-ref:
        value: ${{ jobs.build.outputs.image-ref }}
      build-tag:
        value: ${{ jobs.build.outputs.build-tag }}
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}
      image-artifact:
        value: ${{ jobs.build.outputs.image-artifact }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Docker Build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      image-ref: ${{ steps.tag.outputs.image-ref }}
      build-tag: ${{ steps.tag.outputs.build-tag }}
      image-digest: ${{ inputs.push && steps.build.outputs.digest || '' }}
      image-artifact: ${{ steps.export.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7

      - name: Image tag
        id: tag
        env:
          NAME: ${{ inputs.image-name || github.event.repository.name }}
        run: |
          echo "build-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image-ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ steps.tag.outputs.image-ref }}
          load: true
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tar
        id: export
        if: inputs.export-image
        env:
          IMAGE_REF: ${{ steps.tag.outputs.image-ref }}
          NAME: ${{ github.event.repository.name }}
        run: |
          docker save "$IMAGE_REF" -o "$RUNNER_TEMP/$NAME.tar"
          echo "artifact=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload image tar
        if: inputs.export-image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.export.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.export.outputs.artifact }}.tar
          retention-days: 1
