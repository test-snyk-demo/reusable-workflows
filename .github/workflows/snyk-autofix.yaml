name: Snyk Autofix

# Reusable, deterministic Snyk autofix for a pull request on an npm project.
# On a PR, it applies Snyk's own recommendations to the PR's branch and opens a fix PR against it:
# - Open Source: the upgrade Snyk recommends for each upgradable high/critical issue (upgradePath).
#   Major-version upgrades are listed for review instead, unless allow-major is set.
# - Container (optional, `dockerfile`): the base image Snyk recommends (baseImageRemediation),
#   when it has fewer critical + high issues than the current one.
# It re-scans and opens the fix PR only when the critical + high count goes down. No AI involved.
#
# Caller: on workflow_run (CI completed) for pull requests, skipping branches that start with
# snyk-autofix/ (the fix PRs themselves). Also works on pull_request. A workflow_run caller only
# triggers once it's on the default branch.
# Caller job permissions: contents: write, pull-requests: write.
# Secrets: snyk-token. app-token is optional: a GitHub App token or PAT (contents + pull requests write).
# Without it, GITHUB_TOKEN is used, and GitHub doesn't run CI on PRs it opens, so the fix PR isn't
# scanned until someone pushes to it. GITHUB_TOKEN also needs the repo setting "Allow GitHub Actions
# to create and approve pull requests".

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: lts/*
      severity-threshold:
        type: string
        default: high
      allow-major:
        type: boolean
        default: false
      dockerfile:
        type: string
        default: ""
      snyk-org:
        type: string
    secrets:
      snyk-token:
        required: true
      app-token:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Snyk Autofix
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.snyk-token }}
      SNYK_ORG: ${{ inputs.snyk-org || github.repository_owner }}
      THRESHOLD: ${{ inputs.severity-threshold }}
      ALLOW_MAJOR: ${{ inputs.allow-major }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      PR_BRANCH: ${{ github.head_ref || github.event.workflow_run.head_branch }}
      FIX_BRANCH: snyk-autofix/${{ github.head_ref || github.event.workflow_run.head_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
      GH_TOKEN: ${{ secrets.app-token || github.token }}
    steps:
      - name: Only for pull requests from this repo
        run: |
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" || -z "$PR_NUMBER" ]]; then
            echo "::error title=Snyk Autofix::Runs only on open pull requests from branches in this repo."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.workflow_run.head_branch }}
          token: ${{ secrets.app-token || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            snyk = "1.1308.4"

      - name: Snyk test (before)
        run: snyk test --org="$SNYK_ORG" --severity-threshold="$THRESHOLD" --json > before.json || true

      - name: Read Snyk's upgrade recommendations
        id: plan
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('before.json', 'utf8'));
          const allowMajor = process.env.ALLOW_MAJOR === 'true';
          const cmp = (a, b) => { const x = a.split(/[.-]/).map(Number), y = b.split(/[.-]/).map(Number);
            for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
          const at = (s) => { const i = s.lastIndexOf('@'); return [s.slice(0, i), s.slice(i + 1)]; };
          const target = {}, current = {}, fixes = {};
          for (const v of d.vulnerabilities || []) {
            if (!v.isUpgradable || !v.upgradePath?.[1]) continue;
            const [name, ver] = at(v.upgradePath[1]);
            const [, from] = at(v.from[1]);
            current[name] = from;
            if (!target[name] || cmp(ver, target[name]) > 0) target[name] = ver;
            (fixes[name] ??= new Set()).add(v.id);
          }
          const apply = [], review = [];
          for (const [name, ver] of Object.entries(target)) {
            const major = ver.split('.')[0] !== current[name].split('.')[0];
            (major && !allowMajor ? review : apply).push(`${name}@${ver}|${current[name]}|${fixes[name].size}`);
          }
          console.log(`apply=${apply.join(' ')}`);
          console.log(`review=${review.join(' ')}`);
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Apply dependency upgrades
        if: steps.plan.outputs.apply != ''
        env:
          APPLY: ${{ steps.plan.outputs.apply }}
        run: |
          pkgs=(); for a in $APPLY; do pkgs+=("${a%%|*}"); done
          npm install --ignore-scripts --no-audit --no-fund "${pkgs[@]}"

      - name: Snyk Container base image recommendation
        id: base
        if: inputs.dockerfile != '' && hashFiles(inputs.dockerfile) != ''
        run: |
          current=$(grep -iE '^FROM ' "$DOCKERFILE" | tail -1 | awk '{print $2}')
          snyk container test "$current" --org="$SNYK_ORG" --file="$DOCKERFILE" --exclude-app-vulns > base.txt 2>&1 || true
          sed -n '/^Testing /,/^Pro tip/p' base.txt | grep -vE '^\s*$' || cat base.txt
          read -r best ch < <(CUR="$current" node -e '
            const cur = process.env.CUR; let curn = null, best = null, bn = Infinity;
            for (const l of require("fs").readFileSync("base.txt", "utf8").split("\n")) {
              const m = l.match(/^(\S+:\S+)\s+\d+\s+(\d+) critical, (\d+) high/); if (!m) continue;
              const n = +m[2] + +m[3];
              if (m[1] === cur) curn = n; else if (n < bn) { best = m[1]; bn = n; }
            }
            if (best && curn !== null && bn < curn) console.log(best, `${curn}->${bn}`);') || true
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ -n "$best" ]]; then
            sed -i "s|^FROM $current|FROM $best|I" "$DOCKERFILE"
            echo "image=$best" >> "$GITHUB_OUTPUT"; echo "change=$ch" >> "$GITHUB_OUTPUT"
          fi

      - name: Snyk test (after)
        id: verify
        run: |
          snyk test --org="$SNYK_ORG" --severity-threshold="$THRESHOLD" --json > after.json || true
          count() { jq '[.vulnerabilities[]? | select(.severity == "critical" or .severity == "high") | .id] | unique | length' "$1"; }
          before=$(count before.json); after=$(count after.json)
          echo "before=$before" >> "$GITHUB_OUTPUT"; echo "after=$after" >> "$GITHUB_OUTPUT"
          changed=$(git status --porcelain -- package.json package-lock.json | wc -l)
          if { (( changed > 0 )) && (( after < before )); } || [[ -n "${{ steps.base.outputs.image }}" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f before.json after.json base.txt

      - name: Open or update the fix PR
        id: pr
        if: steps.verify.outputs.open == 'true'
        env:
          APPLY: ${{ steps.plan.outputs.apply }}
          REVIEW: ${{ steps.plan.outputs.review }}
          BEFORE: ${{ steps.verify.outputs.before }}
          AFTER: ${{ steps.verify.outputs.after }}
          BASE_FROM: ${{ steps.base.outputs.current }}
          BASE_TO: ${{ steps.base.outputs.image }}
          BASE_CHANGE: ${{ steps.base.outputs.change }}
        run: |
          {
            echo "Applies **Snyk's recommendations** to \`$PR_BRANCH\` (#$PR_NUMBER). Merge it into that branch."
            echo
            echo "**Open Source, high and critical:** $BEFORE → $AFTER"
            if [[ -n "$APPLY" ]]; then
              echo; echo "| Package | From | To | Snyk issues fixed |"; echo "|---|---|---|---|"
              for a in $APPLY; do IFS='|' read -r to from n <<< "$a"; echo "| \`${to%@*}\` | $from | ${to##*@} | $n |"; done
            fi
            if [[ -n "$BASE_TO" ]]; then
              echo; echo "**Container base image** (\`$DOCKERFILE\`): \`$BASE_FROM\` → \`$BASE_TO\`, critical + high $BASE_CHANGE"
            fi
            if [[ -n "$REVIEW" ]]; then
              echo; echo "**Needs review (major version, not applied):**"
              for a in $REVIEW; do IFS='|' read -r to from n <<< "$a"; echo "- \`${to%@*}\` $from → ${to##*@} ($n issues)"; done
            fi
            echo; echo "_Generated by Snyk Autofix from \`snyk test\` on ${GITHUB_SHA::7}: [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)_"
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$FIX_BRANCH"
          files=(package.json package-lock.json); [[ -n "$DOCKERFILE" && -f "$DOCKERFILE" ]] && files+=("$DOCKERFILE")
          git add "${files[@]}"
          git commit -qm "Snyk Autofix: apply Snyk's recommended upgrades for $PR_BRANCH"
          git push -f origin "$FIX_BRANCH"
          url=$(gh pr list --head "$FIX_BRANCH" --base "$PR_BRANCH" --state open --json url -q '.[0].url')
          if [[ -n "$url" ]]; then gh pr edit "$url" --body-file body.md
          else url=$(gh pr create --head "$FIX_BRANCH" --base "$PR_BRANCH" --title "Snyk Autofix for #$PR_NUMBER: high/critical $BEFORE → $AFTER" --body-file body.md); fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR
        if: ${{ !cancelled() }}
        env:
          URL: ${{ steps.pr.outputs.url }}
          BEFORE: ${{ steps.verify.outputs.before }}
          AFTER: ${{ steps.verify.outputs.after }}
          REVIEW: ${{ steps.plan.outputs.review }}
        run: |
          marker="<!-- snyk-autofix -->"
          if [[ -n "$URL" ]]; then msg="**Snyk Autofix:** high/critical $BEFORE → $AFTER with Snyk's recommended upgrades. Fix PR: $URL"
          elif [[ -n "$REVIEW" ]]; then names=""; for a in $REVIEW; do names+="${a%%|*} "; done
            msg="**Snyk Autofix:** the remaining upgrades are major versions, so they need a human: ${names% }"
          else msg="**Snyk Autofix:** nothing to apply. No upgradable high/critical issues on this branch."; fi
          printf '%s\n%s\n' "$marker" "$msg" > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [[ -n "$id" ]]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh pr comment "$PR_NUMBER" --body-file comment.md; fi
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
